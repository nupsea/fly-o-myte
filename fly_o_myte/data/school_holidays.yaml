# fly-o-myte School Holiday Calendar
# Australian state school holidays by state/territory
# Source: Individual state education department websites
# Update: Check annually around October for the following year's dates
#
# State schools vs independent/Catholic schools:
#   - State schools follow these exact dates
#   - Independent/Catholic schools may vary by up to 7 days — set school_type in config
#   - Individual independent schools set their own calendars; verify with the school
#
# Timezone note:
#   - QLD, NSW, VIC, TAS, ACT: AEST (UTC+10), no DST
#   - SA, NT: ACST (UTC+9:30)
#   - WA: AWST (UTC+8), no DST

