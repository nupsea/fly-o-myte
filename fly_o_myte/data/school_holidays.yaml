#   - Individual independent schools set their own calendars; verify with the school
#
# Timezone note:
#   - QLD, NSW, VIC, TAS, ACT: AEST (UTC+10), no DST
#   - SA, NT: ACST (UTC+9:30)
#   - WA: AWST (UTC+8), no DST

